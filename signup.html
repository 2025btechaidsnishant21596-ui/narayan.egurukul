<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary SEO Meta Tags -->
    <title>Sign Up - Join Narayan e-Gurukul Free Engineering Study Portal</title>
    <meta name="description" content="Create your free Narayan e-Gurukul account and get access to B.Tech study materials, solved PYQs, engineering notes and academic resources for all branches.">
    <meta name="keywords" content="Narayan e-Gurukul signup, engineering portal register, free B.Tech resources account, student registration">
    <meta name="author" content="Narayan e-Gurukul Team">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://narayenegurukul.com/signup.html">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://narayenegurukul.com/signup.html">
    <meta property="og:title" content="Sign Up - Narayan e-Gurukul">
    <meta property="og:description" content="Join Narayan e-Gurukul for free access to B.Tech notes, PYQs, and engineering resources.">
    <meta property="og:site_name" content="Narayan e-Gurukul">
    <meta property="og:locale" content="en_IN">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .auth-section {
            min-height: calc(100vh - var(--navbar-height));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(var(--navbar-height) + 4rem) 6% 4rem;
        }

        .auth-card {
            background: var(--white);
            padding: 3rem;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-light);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .auth-card h2 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
            color: var(--primary);
        }

        .auth-card p {
            margin-bottom: 2.5rem;
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .auth-form .form-group {
            text-align: left;
            margin-bottom: 1.25rem;
        }

        .auth-form input {
            padding: 1rem 1.25rem;
            border-radius: var(--radius-sm);
        }

        .auth-footer {
            margin-top: 1.5rem;
            font-size: 0.95rem;
        }

        .auth-footer a {
            color: var(--accent);
            font-weight: 800;
        }
        
        .social-login {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-light);
        }

        .btn-google {
            background: var(--white);
            color: var(--text-main);
            border: 1px solid var(--border);
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            font-weight: 700;
        }

        .btn-google:hover {
            background: var(--bg-alt);
            border-color: var(--border);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-google:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-google i {
            color: #DB4437;
            font-size: 1.25rem;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 2.5rem 1.5rem;
            }

            .auth-card h2 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar" id="navbar">
            <a href="index.html" class="logo">
                <h1>Narayan <span>e-Gurukul</span></h1>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="btech-studymaterial.html" class="nav-cta">Study Material</a></li>
            </ul>
            <div class="menu-toggle" id="mobile-menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <main>
        <section class="auth-section reveal active">
            <div class="auth-card">
                <h2>Create Account</h2>
                <p>Join Narayan e-Gurukul today!</p>

                <form class="auth-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="student@university.edu" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn primary-btn" style="width: 100%; justify-content: center; margin-top: 1rem;">
                        Sign Up <i class="ri-user-add-line"></i>
                    </button>
                </form>

                <div class="social-login">
                    <button class="btn btn-google" id="googleSignupBtn">
                        <i class="ri-google-fill"></i> Sign up with Google
                    </button>
                </div>

                <div class="auth-footer">
                    Already have an account? <a href="login.html">Login here</a>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>

    <!-- Firebase Auth for Signup -->
    <script type="module">
    import { initializeApp }          from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile,
             GoogleAuthProvider, signInWithPopup, onAuthStateChanged }
             from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

    // ── Firebase config — project-547160493459 ──
    const firebaseConfig = {
        apiKey:            "PASTE_YOUR_API_KEY_HERE",
        authDomain:        "project-547160493459.firebaseapp.com",
        projectId:         "project-547160493459",
        storageBucket:     "project-547160493459.appspot.com",
        messagingSenderId: "PASTE_YOUR_SENDER_ID_HERE",
        appId:             "PASTE_YOUR_APP_ID_HERE"
    };

    const app      = initializeApp(firebaseConfig);
    const auth     = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Redirect if already signed in
    onAuthStateChanged(auth, user => {
        if(user) window.location.href = 'dashboard.html';
    });

    // ── Email/Password Sign Up ──
    document.querySelector('.auth-form').addEventListener('submit', async function(e){
        e.preventDefault();
        const name  = this.querySelector('input[type=text]').value.trim();
        const email = this.querySelector('input[type=email]').value.trim();
        const pass  = this.querySelector('input[type=password]').value;
        const btn   = this.querySelector('button[type=submit]');

        if(!name || !email || !pass){ alert('Please fill in all fields.'); return; }
        if(pass.length < 6){ alert('Password must be at least 6 characters.'); return; }

        btn.disabled = true;
        btn.innerHTML = '<i class="ri-loader-4-line"></i> Creating account…';

        try {
            const cred = await createUserWithEmailAndPassword(auth, email, pass);
            await updateProfile(cred.user, { displayName: name });
            btn.innerHTML = '<i class="ri-checkbox-circle-fill"></i> Account created!';
            setTimeout(() => window.location.href = 'dashboard.html', 1200);
        } catch(err) {
            btn.disabled = false;
            btn.innerHTML = 'Sign Up <i class="ri-user-add-line"></i>';
            const msgs = {
                'auth/email-already-in-use': 'This email is already registered. Please login.',
                'auth/invalid-email':        'Please enter a valid email address.',
                'auth/weak-password':        'Password is too weak. Use at least 6 characters.'
            };
            alert(msgs[err.code] || 'Signup failed: ' + err.message);
        }
    });

    // ── Google Sign Up ──
    document.getElementById('googleSignupBtn').addEventListener('click', async function(){
        this.disabled = true;
        this.innerHTML = '<i class="ri-loader-4-line"></i> Signing in…';
        try {
            const result = await signInWithPopup(auth, provider);
            const name   = result.user.displayName?.split(' ')[0] || 'Student';
            this.innerHTML = `<i class="ri-checkbox-circle-fill" style="color:#10b981"></i> Welcome, ${name}!`;
            setTimeout(() => window.location.href = 'dashboard.html', 1200);
        } catch(err) {
            this.disabled = false;
            this.innerHTML = '<i class="ri-google-fill"></i> Sign up with Google';
            if(err.code !== 'auth/popup-closed-by-user'){
                alert('Google sign-in failed: ' + err.message);
            }
        }
    });
    </script>
</body>
</html>

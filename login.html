<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal — Narayan e-Gurukul</title>
    <meta name="description" content="Login to Narayan e-Gurukul — free B.Tech, JEE, NEET & school competition study material.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
<style>
/* ══ RESET ══ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:#f8fafc;color:#334155;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}

/* ══ SPLIT PAGE ══ */
.page{display:flex;flex:1;min-height:100vh}

/* ══ LEFT PANEL ══ */
.left-panel{
    flex:1;
    background:linear-gradient(135deg,#0ea5e9 0%,#2563eb 50%,#1e3a8a 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:48px 40px;position:relative;overflow:hidden;
}
.left-panel::before{content:'';position:absolute;width:400px;height:400px;background:rgba(255,255,255,0.05);border-radius:50%;top:-100px;left:-100px}
.left-panel::after{content:'';position:absolute;width:300px;height:300px;background:rgba(255,255,255,0.05);border-radius:50%;bottom:-80px;right:-80px}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.05) 1px,transparent 1px);background-size:40px 40px}
.left-content{position:relative;z-index:1;text-align:center;width:100%}

/* Brand */
.brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:32px}
.brand-icon{width:52px;height:52px;background:rgba(255,255,255,0.2);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.7rem;color:#fff;border:1px solid rgba(255,255,255,0.3)}
.brand-name{font-size:1.4rem;font-weight:800;color:#fff;line-height:1.1;text-align:left}
.brand-name span{display:block;font-size:0.68rem;font-weight:500;color:rgba(255,255,255,0.75);letter-spacing:1.2px;text-transform:uppercase;margin-top:3px}

.left-tagline{color:rgba(255,255,255,0.9);font-size:0.95rem;font-weight:500;line-height:1.6;max-width:260px;margin:0 auto}
.left-tagline strong{color:#fff;font-weight:800}

/* ══ RIGHT PANEL ══ */
.right-panel{
    width:460px;min-width:360px;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    padding:40px 36px;
    box-shadow:-6px 0 32px rgba(0,0,0,0.06);
    overflow-y:auto;
}
.login-box{width:100%;max-width:360px}

/* Back link */
.back-link{display:flex;align-items:center;justify-content:center;gap:6px;font-size:0.82rem;color:#64748b;font-weight:600;margin-bottom:28px;transition:color .2s}
.back-link:hover{color:#2563eb}

/* Alert bar */
.alert-bar{
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:0.82rem;font-weight:600;color:#64748b;
    margin-bottom:20px;
}
.alert-bell{
    position:relative;display:inline-flex;align-items:center;justify-content:center;
    width:32px;height:32px;background:#eff6ff;border-radius:50%;
    font-size:1.1rem;color:#2563eb;
}
.alert-dot{
    position:absolute;top:2px;right:2px;
    width:14px;height:14px;background:#ef4444;
    border-radius:50%;border:2px solid #fff;
    font-size:0.55rem;font-weight:800;color:#fff;
    display:flex;align-items:center;justify-content:center;
}

/* Title */
.login-title{font-size:1.65rem;font-weight:800;color:#0f172a;margin-bottom:24px;text-align:center}

/* Form fields */
.field{margin-bottom:14px}
.field-wrap{
    display:flex;align-items:center;
    border:1.5px solid #cbd5e1;
    border-radius:8px;background:#f8fafc;overflow:hidden;
    transition:border-color .2s,box-shadow .2s;
}
.field-wrap:focus-within{border-color:#2563eb;background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
.field-icon{
    width:44px;height:48px;
    display:flex;align-items:center;justify-content:center;
    color:#94a3b8;font-size:1.1rem;flex-shrink:0;
    border-right:1.5px solid #e2e8f0;
}
.field-wrap input{
    flex:1;padding:12px 14px;border:none;outline:none;
    font-family:'Outfit',sans-serif;font-size:0.9rem;color:#0f172a;background:transparent;
}
.field-eye{width:44px;height:48px;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:1rem;cursor:pointer;flex-shrink:0;background:transparent;border:none}

/* Login button */
.btn-login{
    width:100%;background:#2563eb;color:#fff;
    border:none;padding:14px;border-radius:10px;
    font-size:0.95rem;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:all .2s;font-family:'Outfit',sans-serif;margin-top:8px;
}
.btn-login:hover{background:#1d4ed8;transform:translateY(-1px);box-shadow:0 6px 20px rgba(37,99,235,0.3)}

.forgot-row{text-align:center;margin-top:14px}
.forgot{font-size:0.84rem;color:#2563eb;font-weight:700}

/* Help section */
.help-section{
    margin-top:40px;padding-top:24px;
    border-top:1px solid #f1f5f9;
    text-align:center;
}
.help-section p{font-size:0.8rem;color:#64748b;font-weight:600;margin-bottom:12px}
.help-section a{font-size:0.85rem;color:#2563eb;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}

.social-row{display:flex;justify-content:center;gap:12px;margin-top:20px}
.social-icon{
    width:40px;height:40px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:1.2rem;color:#fff;transition:all .2s;
}
.si-fb{background:#1877f2}.si-li{background:#0a66c2}
.si-ig{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.si-yt{background:#ff0000}

@media(max-width:860px){
    .left-panel{display:none}
    .right-panel{width:100%; min-width: unset; padding: 20px 16px;}
    .login-box{max-width: 100%;}
    .login-title{font-size: 1.4rem;}
}
@media(max-width:480px){
    .help-section a { font-size: 0.75rem; }
    .social-icon { width: 32px; height: 32px; font-size: 1rem; }
}
</style>
</head>
<body>

<div class="page">
    <div class="left-panel">
        <div class="grid-bg"></div>
        <div class="left-content">
            <div class="brand">
                <div class="brand-icon"><i class="ri-graduation-cap-fill"></i></div>
                <div class="brand-name">Narayan e-Gurukul<span>Student Portal</span></div>
            </div>
            <p class="left-tagline"><strong>Learn Better. Practice More.</strong><br>Free study material for every engineering student.</p>
        </div>
    </div>

    <div class="right-panel">
        <div class="login-box">
            <a href="index.html" class="back-link"><i class="ri-arrow-left-line"></i> Back to Home</a>

            <div class="alert-bar">
                <div class="alert-bell">
                    <i class="ri-notification-3-fill"></i>
                    <div class="alert-dot">1</div>
                </div>
                <span>Update Alerts</span>
            </div>

            <div class="login-title">Sign in to Student Portal</div>

            <form id="loginForm">
                <div class="field">
                    <div class="field-wrap">
                        <div class="field-icon"><i class="ri-user-3-line"></i></div>
                        <input type="text" id="emailInput" placeholder="Email Address or Username" required>
                    </div>
                </div>
                <div class="field">
                    <div class="field-wrap">
                        <div class="field-icon"><i class="ri-lock-password-line"></i></div>
                        <input type="password" id="passInput" placeholder="Password" required>
                        <button type="button" class="field-eye" id="eyeBtn"><i class="ri-eye-off-line" id="eyeIcon"></i></button>
                    </div>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">LOGIN <i class="ri-login-circle-line"></i></button>
            </form>

            <div class="forgot-row">
                <a href="forgot-password.html" class="forgot">Forgot Password?</a>
            </div>

            <div class="help-section">
                <p>Need Help?</p>
                <a href="tel:+919468974044"><i class="ri-phone-line"></i> +91-9468974044</a>
                <a href="mailto:egurukulnarayan@gmail.com"><i class="ri-mail-line"></i> egurukulnarayan@gmail.com</a>
                <a href="https://narayenegurukul.com" target="_blank"><i class="ri-global-line"></i> narayenegurukul.com</a>
                <div class="social-row">
                    <a href="#" class="social-icon si-fb"><i class="ri-facebook-fill"></i></a>
                    <a href="#" class="social-icon si-li"><i class="ri-linkedin-fill"></i></a>
                    <a href="#" class="social-icon si-ig"><i class="ri-instagram-fill"></i></a>
                    <a href="#" class="social-icon si-yt"><i class="ri-youtube-fill"></i></a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ══ Firebase & Logic ══ -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "narayan-e-gurukul.firebaseapp.com",
        projectId: "narayan-e-gurukul",
        storageBucket: "narayan-e-gurukul.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, user => { if(user) window.location.href = 'student-dashboard.html'; });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('emailInput').value;
        const password = document.getElementById('passInput').value;
        const btn = document.getElementById('loginBtn');
        btn.disabled = true; btn.innerHTML = '<i class="ri-loader-4-line ai-spin"></i> Logging in...';
        try {
            await signInWithEmailAndPassword(auth, email, password);
            window.location.href = 'student-dashboard.html';
        } catch (error) {
            alert("Login failed: " + error.message);
            btn.disabled = false; btn.innerHTML = 'LOGIN <i class="ri-login-circle-line"></i>';
        }
    });

    document.getElementById('eyeBtn').addEventListener('click', () => {
        const p = document.getElementById('passInput');
        const show = p.type === 'password';
        p.type = show ? 'text' : 'password';
        document.getElementById('eyeIcon').className = show ? 'ri-eye-line' : 'ri-eye-off-line';
    });
</script>
</body>
</html>

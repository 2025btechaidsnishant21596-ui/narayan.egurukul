<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary SEO Meta Tags -->
    <title>Login - Access Your Narayan e-Gurukul Account | Engineering Study Portal</title>
    <meta name="description" content="Login to Narayan e-Gurukul to access free B.Tech study materials, solved PYQs, notes, and engineering resources for CSE, AIDS, and AIML students.">
    <meta name="keywords" content="Narayan e-Gurukul login, engineering portal login, B.Tech student login, study material access">
    <meta name="author" content="Narayan e-Gurukul Team">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://narayenegurukul.com/login.html">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://narayenegurukul.com/login.html">
    <meta property="og:title" content="Login - Narayan e-Gurukul">
    <meta property="og:description" content="Login to access free B.Tech notes, solved PYQs, and engineering resources.">
    <meta property="og:site_name" content="Narayan e-Gurukul">
    <meta property="og:locale" content="en_IN">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        .login-section {
            min-height: calc(100vh - var(--navbar-height));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(var(--navbar-height) + 4rem) 6% 4rem;
        }

        .login-card {
            background: var(--white);
            padding: 3rem;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-light);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .login-card h2 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .login-card p {
            margin-bottom: 2.5rem;
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .login-form .form-group {
            text-align: left;
            margin-bottom: 1.25rem;
        }

        .login-form input {
            padding: 1rem 1.25rem;
            border-radius: var(--radius-sm);
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .login-options a {
            color: var(--accent);
            font-weight: 600;
        }

        .social-login {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-light);
        }

        .btn-google {
            background: var(--white);
            color: var(--text-main);
            border: 1px solid var(--border);
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            font-weight: 700;
        }

        .btn-google:hover {
            background: var(--bg-alt);
            border-color: var(--border);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-google:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-google i {
            color: #DB4437;
            font-size: 1.25rem;
        }

        .auth-footer {
            margin-top: 1.5rem;
            font-size: 0.95rem;
        }

        .auth-footer a {
            color: var(--accent);
            font-weight: 800;
        }

        @media (max-width: 480px) {
            .login-section {
                padding: calc(var(--navbar-height) + 2rem) 1rem 2rem;
            }

            .login-card {
                padding: 2rem 1.5rem;
            }

            .login-card h2 {
                font-size: 1.75rem;
            }

            .login-card p {
                font-size: 0.95rem;
                margin-bottom: 2rem;
            }

            .login-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar" id="navbar">
            <a href="index.html" class="logo">
                <h1>Narayan <span>e-Gurukul</span></h1>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="btech-studymaterial.html" class="nav-cta">Study Material</a></li>
            </ul>
            <div class="menu-toggle" id="mobile-menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <main>
        <section class="login-section reveal active">
            <div class="login-card">
                <h2>Welcome Back</h2>
                <p>Login to access premium resources</p>

                <form class="login-form" id="loginForm">
                    <div class="form-group" id="emailGroup">
                        <label>Email Address</label>
                        <input type="email" id="emailInput" placeholder="student@university.edu" required>
                    </div>
                    
                    <div class="form-group" id="otpGroup" style="display: none;">
                        <label>Enter OTP</label>
                        <input type="text" id="otpInput" placeholder="Enter 6-digit OTP" pattern="\d{6}" maxlength="6">
                        <small id="otpMessage" style="color: var(--accent); display: block; margin-top: 5px; font-weight: 500;">OTP sent to your email</small>
                    </div>

                    <div class="login-options">
                        <label
                            style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-muted); font-weight: 500;">
                            <input type="checkbox" style="width: auto; padding: 0;"> Remember me
                        </label>
                    </div>

                    <button type="button" id="sendOtpBtn" class="btn primary-btn" style="width: 100%; justify-content: center;">Send OTP <i class="ri-mail-send-line"></i></button>
                    <button type="submit" id="verifyLoginBtn" class="btn primary-btn" style="width: 100%; justify-content: center; display: none;">Verify & Login <i class="ri-login-circle-line"></i></button>
                </form>

                <script>
                    document.getElementById('sendOtpBtn').addEventListener('click', function() {
                        const emailInput = document.getElementById('emailInput');
                        if (emailInput.checkValidity() && emailInput.value) {
                            // Simulate sending OTP
                            document.getElementById('sendOtpBtn').innerHTML = '<i class="ri-loader-4-line ri-spin"></i> Sending...';
                            
                            setTimeout(() => {
                                // Transition to OTP UI
                                document.getElementById('otpGroup').style.display = 'block';
                                document.getElementById('sendOtpBtn').style.display = 'none';
                                document.getElementById('verifyLoginBtn').style.display = 'flex';
                                emailInput.readOnly = true;
                                emailInput.style.opacity = '0.7';
                            }, 1000);
                        } else {
                            emailInput.reportValidity();
                        }
                    });

                    document.getElementById('loginForm').addEventListener('submit', function(e) {
                        e.preventDefault();
                        const otpInput = document.getElementById('otpInput');
                        if (otpInput.value.length === 6) {
                            document.getElementById('verifyLoginBtn').innerHTML = '<i class="ri-loader-4-line ri-spin"></i> Verifying...';
                            setTimeout(() => {
                                alert('Login Successful!');
                                window.location.href = 'index.html';
                            }, 1500);
                        } else {
                            alert('Please enter a valid 6-digit OTP.');
                        }
                    });
                </script>

                <div class="social-login">
                    <button class="btn btn-google">
                        <i class="ri-google-fill"></i> Continue with Google
                    </button>
                </div>

                <div class="auth-footer">
                    Don't have an account? <a href="signup.html">Sign up here</a>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="College Level Study Material - Coming Soon">
    <title>College Study Material - Coming Soon</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        .coming-soon-section {
            min-height: calc(100vh - var(--navbar-height));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: calc(var(--navbar-height) + 4rem) 6% 4rem;
            text-align: center;
            background-color: var(--white);
        }

        .poster-container {
            max-width: 600px;
            width: 100%;
            margin-bottom: 2.5rem;
        }

        .poster-container img {
            width: 100%;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-light);
        }

        .coming-soon-text h2 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }

        .coming-soon-text p {
            font-size: 1.25rem;
            max-width: 650px;
            margin: 0 auto 2.5rem;
        }

        @media (max-width: 768px) {
            .coming-soon-text h2 { font-size: 2.5rem; }
            .coming-soon-text p { font-size: 1.1rem; }
        }

        @media (max-width: 480px) {
            .coming-soon-text h2 { font-size: 2rem; }
            .coming-soon-text p { font-size: 1rem; }
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar" id="navbar">
            <a href="index.html" class="logo">
                <h1>Narayan <span>e-Gurukul</span></h1>
            </a>
            <ul class="nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="btech-studymaterial.html" class="nav-cta active">Study Material</a></li>
            </ul>
            <div class="menu-toggle" id="mobile-menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <main>
        <section class="coming-soon-section reveal active">
            <div class="poster-container">
                <img src="02.png" alt="Coming Soon Poster">
            </div>
            <div class="coming-soon-text">
                <h2>B.Tech Study Material <br><span>Coming Soon</span></h2>
                <p>We are working hard to bring you the best B.Tech study resources, PYQs, and notes. Stay tuned
                    for the launch!</p>
                <a href="index.html" class="btn primary-btn"><i class="ri-arrow-left-line"></i> Back to Home</a>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
